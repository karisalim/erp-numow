<helmet>
<style>
  :root{
    --n50:#FAFBFC;--n100:#F3F4F6;--n200:#E5E7EB;--n300:#D1D5DB;--n400:#9CA3AF;
    --n500:#6B7280;--n600:#4B5563;--n700:#374151;--n800:#1F2937;--n900:#111827;
    --pr50:#EFF6FF;--pr100:#DBEAFE;--pr500:#3B82F6;--pr600:#2563EB;--pr700:#1D4ED8;
    --su50:#ECFDF5;--su500:#10B981;--su600:#059669;--su700:#047857;
    --er50:#FEF2F2;--er500:#EF4444;--er600:#DC2626;--er700:#B91C1C;
    --wa50:#FFFBEB;--wa500:#F59E0B;--wa600:#D97706;--wa700:#B45309;
    --in50:#ECFEFF;--in500:#06B6D4;--in700:#0E7490;
    --vi50:#F5F3FF;--vi500:#8B5CF6;--vi700:#6D28D9;
    --font:"Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --mono:"SF Mono","Monaco","Menlo","Courier New",monospace;
    --sh-sm:0 1px 2px rgba(0,0,0,.05);--sh-md:0 4px 6px rgba(0,0,0,.08);--sh-lg:0 10px 24px rgba(0,0,0,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;font-family:var(--font);background:var(--n100);color:var(--n900);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--n500)}
  .app{display:flex;height:100vh;overflow:hidden}
  /* sidebar */
  .sidebar{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--n200);display:flex;flex-direction:column}
  .side-logo{height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--n200)}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--pr500),var(--pr700));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:var(--sh-sm)}
  .side-tenant{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--n400);font-weight:700}
  .nav{padding:10px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
  .nav-sec{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--n400);font-weight:700;padding:12px 10px 4px}
  .nav-item{height:38px;padding:0 11px;border-radius:8px;display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--n600);text-align:left;width:100%}
  .nav-item:hover{background:var(--n100)}
  .nav-item.active{background:var(--pr50);color:var(--pr700);font-weight:600}
  .nav-item svg{flex:0 0 18px}
  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .header{height:64px;flex:0 0 64px;background:#fff;border-bottom:1px solid var(--n200);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:relative;z-index:30}
  .h-title{font-size:16px;font-weight:700;color:var(--n900);line-height:1.15}
  .h-sub{font-size:12px;color:var(--n500)}
  .page{flex:1;overflow-y:auto;padding:22px}
  .page-narrow{max-width:1180px;margin:0 auto}
  /* pills */
  .pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--n200);font-size:12px;font-weight:600;background:#fff}
  .pill.ok{background:var(--su50);border-color:rgba(16,185,129,.3);color:var(--su700)}
  .pill.warn{background:var(--wa50);border-color:rgba(245,158,11,.3);color:var(--wa700)}
  .pill.info{background:var(--in50);border-color:rgba(6,182,212,.3);color:var(--in700)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--n800);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
  /* cards */
  .card{background:#fff;border:1px solid var(--n200);border-radius:10px;box-shadow:var(--sh-sm)}
  .card-h{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--n200)}
  .card-t{font-size:14px;font-weight:700}
  .card-b{padding:16px}
  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:8px;font-weight:600;font-size:13.5px;transition:.12s;white-space:nowrap}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-sm{height:32px;padding:0 11px;font-size:12.5px}
  .btn-lg{height:48px;padding:0 20px;font-size:15px}
  .btn-xl{height:60px;font-size:17px;border-radius:10px}
  .btn-pri{background:var(--pr600);color:#fff}.btn-pri:hover{background:var(--pr700)}
  .btn-sec{background:#fff;color:var(--pr700);border:1px solid var(--n300)}.btn-sec:hover{background:var(--n50)}
  .btn-ghost{background:transparent;color:var(--n600)}.btn-ghost:hover{background:var(--n100)}
  .btn-danger{background:var(--er600);color:#fff}.btn-danger:hover{background:var(--er700)}
  .btn-success{background:var(--su600);color:#fff}.btn-success:hover{background:var(--su700)}
  .btn-warn{background:var(--wa500);color:#fff}.btn-warn:hover{background:var(--wa600)}
  .btn-dark{background:var(--n900);color:#fff}.btn-dark:hover{background:var(--n800)}
  /* badges */
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.01em}
  .b-gray{background:var(--n100);color:var(--n700)}
  .b-blue{background:var(--pr50);color:var(--pr700)}
  .b-green{background:var(--su50);color:var(--su700)}
  .b-amber{background:var(--wa50);color:var(--wa700)}
  .b-red{background:var(--er50);color:var(--er700)}
  .b-cyan{background:var(--in50);color:var(--in700)}
  .b-violet{background:var(--vi50);color:var(--vi700)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  /* inputs */
  .input,.select{height:40px;width:100%;border:1px solid var(--n300);border-radius:8px;padding:0 12px;background:#fff;color:var(--n900)}
  .input:focus,.select:focus{outline:2px solid var(--pr500);outline-offset:-1px;border-color:var(--pr500)}
  .lbl{font-size:12.5px;font-weight:600;color:var(--n700);display:block;margin-bottom:6px}
  /* tables */
  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--n500);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--n200);background:var(--n50)}
  .tbl td{padding:12px 14px;border-bottom:1px solid var(--n100);font-size:13.5px}
  .tbl tr:hover td{background:var(--n50)}
  .tbl .r{text-align:right}
  /* kpi */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:#fff;border:1px solid var(--n200);border-radius:10px;padding:16px;box-shadow:var(--sh-sm)}
  .kpi-lbl{font-size:12px;color:var(--n500);font-weight:600;display:flex;align-items:center;gap:7px}
  .kpi-val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
  .kpi-sub{font-size:11.5px;margin-top:3px}
  /* product tiles */
  .tile{border:1px solid var(--n200);border-radius:10px;background:#fff;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px;transition:.1s;box-shadow:var(--sh-sm)}
  .tile:hover{border-color:var(--pr400);box-shadow:var(--sh-md);transform:translateY(-1px)}
  .tile:active{transform:translateY(0)}
  .tile-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:18px}
  /* table tiles */
  .ttile{border-radius:12px;padding:14px;text-align:left;border:1.5px solid var(--n200);background:#fff;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;transition:.12s;position:relative;box-shadow:var(--sh-sm)}
  .ttile:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
  .ttile-name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .ts-available{border-color:var(--n200);background:#fff}
  .ts-occupied{border-color:var(--pr500);background:var(--pr50)}
  .ts-kitchen{border-color:var(--wa500);background:var(--wa50)}
  .ts-bill{border-color:var(--in500);background:var(--in50)}
  .ts-clearing{border-color:var(--su500);background:var(--su50)}
  .ts-oos{border-color:var(--n200);background:repeating-linear-gradient(45deg,var(--n50),var(--n50) 7px,#fff 7px,#fff 14px);color:var(--n400)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.55);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:100;padding:24px;animation:fade .15s ease-out}
  .modal{background:#fff;border-radius:14px;box-shadow:var(--sh-lg);width:100%;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .18s ease-out}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--n200);display:flex;align-items:center;justify-content:space-between}
  .modal-b{padding:22px;overflow-y:auto}
  .modal-f{padding:16px 22px;border-top:1px solid var(--n200);display:flex;gap:10px;justify-content:flex-end;background:var(--n50)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
  @keyframes flash{0%{background:var(--su50)}100%{background:transparent}}
  .flash{animation:flash .7s ease-out}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin 1s linear infinite}
  @keyframes blink{50%{opacity:.25}}
  .live{animation:blink 1.4s steps(1) infinite}
  /* dropdown */
  .dropdown{position:absolute;top:58px;right:18px;width:320px;background:#fff;border:1px solid var(--n200);border-radius:12px;box-shadow:var(--sh-lg);z-index:40;overflow:hidden;animation:pop .15s ease-out}
  .scroll-x{overflow-x:auto}
  .seg{display:inline-flex;background:var(--n100);border-radius:9px;padding:3px}
  .seg button{height:32px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--n600)}
  .seg button.on{background:#fff;color:var(--n900);box-shadow:var(--sh-sm)}
  .toggle{width:42px;height:24px;border-radius:99px;background:var(--n300);position:relative;transition:.15s;flex:0 0 42px}
  .toggle.on{background:var(--su500)}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:var(--sh-sm)}
  .toggle.on::after{left:20px}
  .chip{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--n300);background:#fff;font-size:12.5px;font-weight:600;color:var(--n600);display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--n900);color:#fff;border-color:var(--n900)}
  .empty{padding:40px;text-align:center;color:var(--n400)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--n300);border-radius:6px;border:2px solid var(--n100)}
</style>
