<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuperPOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --neutral-50:#FAFBFC;--neutral-100:#F3F4F6;--neutral-200:#E5E7EB;--neutral-300:#D1D5DB;
    --neutral-400:#9CA3AF;--neutral-500:#6B7280;--neutral-600:#4B5563;--neutral-700:#374151;
    --neutral-800:#1F2937;--neutral-900:#111827;
    --primary-50:#EFF6FF;--primary-100:#DBEAFE;--primary-500:#3B82F6;--primary-600:#2563EB;--primary-700:#1D4ED8;
    --success-50:#ECFDF5;--success-500:#10B981;--success-600:#059669;--success-700:#047857;
    --error-50:#FEF2F2;--error-500:#EF4444;--error-600:#DC2626;--error-700:#B91C1C;
    --warning-50:#FFFBEB;--warning-500:#F59E0B;--warning-600:#D97706;--warning-700:#B45309;
    --info-50:#ECFEFF;--info-500:#06B6D4;--info-700:#0E7490;
    --bg-primary:var(--neutral-50);--bg-secondary:#fff;--bg-tertiary:var(--neutral-100);
    --text-primary:var(--neutral-900);--text-secondary:var(--neutral-600);--text-tertiary:var(--neutral-500);
    --border-subtle:var(--neutral-200);--border-default:var(--neutral-300);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
    --shadow-md:0 4px 6px rgba(0,0,0,0.08);
    --shadow-lg:0 10px 15px rgba(0,0,0,0.12);
    --font-body:"Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --font-mono:"SF Mono","Monaco","Menlo","Courier New",monospace;
  }
  html,body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit}
  .focus-ring:focus-visible{outline:2px solid var(--primary-500);outline-offset:2px}
  .row-zebra:nth-child(even){background:var(--neutral-50)}
  @keyframes blink{50%{opacity:0}}
  .caret{display:inline-block;width:2px;height:1.1em;background:var(--primary-500);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes flash{0%{background:var(--success-50)}100%{background:transparent}}
  .scan-flash{animation:flash 600ms ease-out}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin 1s linear infinite}
  @keyframes pulse-ring{0%{transform:scale(.95);opacity:.7}70%{transform:scale(1.4);opacity:0}100%{transform:scale(1.4);opacity:0}}
  .pulse-ring{animation:pulse-ring 1.5s cubic-bezier(0.4,0,0.6,1) infinite}
  @keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .fade-in{animation:fade-in 200ms ease-out}
  /* Receipt mono */
  .receipt{font-family:var(--font-mono);font-size:13px;line-height:1.55;color:#000}
  .receipt .dashed{border-top:1px dashed #999;margin:8px 0}
  /* No-spin number input */
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  /* Tailwind theme via class on <html> for color tokens used in markup */
</style>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        neutral:{50:'#FAFBFC',100:'#F3F4F6',200:'#E5E7EB',300:'#D1D5DB',400:'#9CA3AF',500:'#6B7280',600:'#4B5563',700:'#374151',800:'#1F2937',900:'#111827'},
        brand:{50:'#EFF6FF',100:'#DBEAFE',500:'#3B82F6',600:'#2563EB',700:'#1D4ED8'},
        success:{50:'#ECFDF5',500:'#10B981',600:'#059669',700:'#047857'},
        danger:{50:'#FEF2F2',500:'#EF4444',600:'#DC2626',700:'#B91C1C'},
        warn:{50:'#FFFBEB',500:'#F59E0B',600:'#D97706',700:'#B45309'},
      },
      fontFamily:{sans:['"Segoe UI"','-apple-system','BlinkMacSystemFont','system-ui','sans-serif'],mono:['"SF Mono"','Monaco','Menlo','monospace']},
      boxShadow:{sm:'0 1px 2px rgba(0,0,0,0.05)',md:'0 4px 6px rgba(0,0,0,0.08)',lg:'0 10px 15px rgba(0,0,0,0.12)'},
      borderRadius:{md:'8px',lg:'12px'},
    }}
  }
</script>

/* ============================================================

  { id:'p1',  barcode:'5410188006353', sku:'BVR-001', name:'Coca-Cola 330ml',       category:'Beverages', price:1.20, cost:0.50, tax:0.10, stock:148, reorder:50, color:'#dc2626' },

  { id:'p12', barcode:'8000500037560', sku:'CHO-020', name:'Nutella 400g',          category:'Pantry',    price:4.95, cost:2.80, tax:0.10, stock:54,  reorder:20, color:'#78350f' },
];

const QUICK_GRID = ['p1','p3','p5','p2','p9','p7','p10','p12'].map(id=>PRODUCTS.find(p=>p.id===id));

const fmt = n => '€' + n.toFixed(2);
const stockBadge = (p) => {
  if (p.stock === 0) return { label:'Out', kind:'danger' };
  if (p.stock < p.reorder) return { label:'Low', kind:'warn' };
  return { label:'In stock', kind:'success' };
};

/* ============================================================
   UI PRIMITIVES
============================================================ */
const Btn = ({variant='primary', size='md', className='', children, ...p}) => {
  const sz = { sm:'h-8 px-3 text-[13px]', md:'h-10 px-4 text-sm', lg:'h-12 px-5 text-base', xl:'h-14 px-6 text-base' }[size];
  const v = {
    primary:'bg-brand-500 text-white hover:bg-brand-600 active:bg-brand-700 disabled:bg-neutral-300 disabled:text-neutral-500',
    secondary:'bg-white text-brand-600 border border-neutral-300 hover:bg-neutral-50 active:bg-neutral-100',
    tertiary:'bg-transparent text-brand-600 hover:bg-brand-50',
    ghost:'bg-transparent text-neutral-600 hover:bg-neutral-100',
    danger:'bg-danger-500 text-white hover:bg-danger-600 active:bg-danger-700',
    success:'bg-success-500 text-white hover:bg-success-600 active:bg-success-700',
    dark:'bg-neutral-900 text-white hover:bg-neutral-800',
  }[variant];
  return <button className={`inline-flex items-center justify-center gap-2 rounded-md font-semibold transition-colors focus-ring disabled:cursor-not-allowed ${sz} ${v} ${className}`} {...p}>{children}</button>;
};

const Badge = ({kind='gray', size='sm', children}) => {
  const c = {
    gray:'bg-neutral-100 text-neutral-700',
    success:'bg-success-50 text-success-700',
    danger:'bg-danger-50 text-danger-700',
    warn:'bg-warn-50 text-warn-700',
    info:'bg-[#ECFEFF] text-[#0E7490]',
    brand:'bg-brand-50 text-brand-700',
  }[kind];
  const sz = size==='md'?'px-3 py-1 text-[12px]':'px-2 py-0.5 text-[11px]';
  return <span className={`inline-flex items-center gap-1 rounded ${sz} font-semibold ${c}`}>{children}</span>;
};

const Card = ({className='',children}) => <div className={`bg-white border border-neutral-200 rounded-lg shadow-sm ${className}`}>{children}</div>;

    barcode: <svg {...s} {...stroke} viewBox="0 0 24 24"><path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14"/></svg>,

    receipt: <svg {...s} {...stroke} viewBox="0 0 24 24"><path d="M5 3h14v18l-2-1.5L15 21l-2-1.5L11 21l-2-1.5L7 21 5 19.5V3Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>,
    printer: <svg {...s} {...stroke} viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg>,

    pos:     <svg {...s} {...stroke} viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M7 14h4"/></svg>,
    box:     <svg {...s} {...stroke} viewBox="0 0 24 24"><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg>,
    chart:   <svg {...s} {...stroke} viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-5 4 3 5-7"/></svg>,
    users:   <svg {...s} {...stroke} viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-3.5 3-6 7-6s7 2.5 7 6M17 11a3 3 0 1 0 0-6M22 21c0-2.8-2-5-5-5.5"/></svg>,
    gear:    <svg {...s} {...stroke} viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>,

/* ============================================================
   LAYOUT — Sidebar + Header
============================================================ */
const Sidebar = ({route, setRoute, onLogout}) => {
  const items = [
    { id:'pos', label:'Point of Sale', icon:'pos' },
    { id:'dashboard', label:'Dashboard', icon:'chart' },
    { id:'products', label:'Products', icon:'box' },
    { id:'scale', label:'Scale', icon:'barcode' },
    { id:'sales', label:'Sales', icon:'receipt' },
    { id:'users', label:'Users', icon:'users' },
    { id:'settings', label:'Settings', icon:'gear' },
  ];
  return (
    <aside className="w-[220px] shrink-0 bg-white border-r border-neutral-200 flex flex-col">
      <div className="h-16 px-5 flex items-center gap-2 border-b border-neutral-200">
        <div className="w-8 h-8 rounded-md bg-brand-500 grid place-items-center text-white font-bold">S</div>
        <div className="font-semibold text-[15px] tracking-tight">SuperPOS</div>
      </div>
      <nav className="p-3 flex-1 flex flex-col gap-0.5">
        {items.map(it => {
          const active = route===it.id;
          return (
            <button key={it.id} onClick={()=>setRoute(it.id)}
              className={`h-11 px-3 rounded-md flex items-center gap-3 text-[14px] focus-ring text-start
                ${active ? 'bg-brand-50 text-brand-700 font-semibold' : 'text-neutral-600 hover:bg-neutral-100'}`}>
              <Icon name={it.icon} size={20} />
              <span>{it.label}</span>
            </button>
          );
        })}
        <div className="mt-auto pt-3 border-t border-neutral-200">
          <button onClick={onLogout} className="w-full h-11 px-3 rounded-md flex items-center gap-3 text-[14px] text-neutral-600 hover:bg-neutral-100">
            <Icon name="logout" size={20} /><span>Sign out</span>
          </button>
        </div>
      </nav>
    </aside>
  );
};

const Header = ({title, subtitle, right, online, pendingSync}) => (
  <header className="h-16 px-6 border-b border-neutral-200 bg-white flex items-center justify-between">
    <div className="min-w-0">
      <div className="text-[15px] font-semibold text-neutral-900 truncate">{title}</div>
      {subtitle && <div className="text-[12px] text-neutral-500 truncate">{subtitle}</div>}
    </div>
    <div className="flex items-center gap-3">
      {right}
      <div className={`flex items-center gap-2 px-3 h-9 rounded-md border text-[12px] font-medium
        ${online ? 'bg-success-50 border-success-500/30 text-success-700' : 'bg-warn-50 border-warn-500/30 text-warn-700'}`}>
        <Icon name={online?'wifi':'wifiOff'} size={14} />
        {online ? 'Online' : <>Offline · {pendingSync} pending</>}
      </div>
      <div className="flex items-center gap-2 pl-3 border-l border-neutral-200">
        <div className="w-8 h-8 rounded-full bg-neutral-200 grid place-items-center text-[12px] font-semibold text-neutral-700">AH</div>
        <div className="text-[13px] hidden md:block">
          <div className="font-semibold leading-tight">Ahmed H.</div>
          <div className="text-neutral-500 leading-tight">Cashier · POS-01</div>
        </div>
      </div>
    </div>
  </header>
);

const OfflineBanner = ({pending}) => (
  <div className="h-9 bg-warn-50 border-b border-warn-500/30 text-warn-700 px-6 flex items-center gap-2 text-[12.5px]">
    <Icon name="wifiOff" size={14} />
    <span className="font-semibold">Offline mode active.</span>
    <span>Transactions are saved locally and will sync when connection returns.</span>
    <span className="ml-auto flex items-center gap-2"><Icon name="sync" size={14} /><b>{pending}</b> pending</span>
  </div>
);

/* ============================================================
   LOGIN
============================================================ */
const LoginScreen = ({onLogin}) => {
  const [email, setEmail] = useState('ahmed@superpos.io');
  const [pw, setPw] = useState('demo1234');
  const [show, setShow] = useState(false);
  const [loading, setLoading] = useState(false);
  const submit = (e) => { e.preventDefault(); setLoading(true); setTimeout(()=>onLogin(),700); };
  return (
    <div className="min-h-screen grid place-items-center bg-neutral-100 p-6">
      <div className="w-full max-w-[420px]">
        <div className="flex items-center justify-center gap-3 mb-8">
          <div className="w-11 h-11 rounded-lg bg-brand-500 grid place-items-center text-white font-bold text-xl shadow-md">S</div>
          <div>
            <div className="text-[22px] font-semibold tracking-tight leading-none">SuperPOS</div>
            <div className="text-[12px] text-neutral-500 mt-1">Cloud retail operating system</div>
          </div>
        </div>
        <Card className="p-7">
          <h1 className="text-[20px] font-semibold mb-1">Sign in to your terminal</h1>
          <p className="text-[13px] text-neutral-500 mb-6">Use your cashier or admin credentials.</p>
          <form onSubmit={submit} className="flex flex-col gap-4">
            <label className="text-[13px] font-semibold text-neutral-700">

const BarcodeInput = ({value, setValue, onSubmit, error}) => {
  const ref = useRef(null);
  // Refocus rules
  useEffect(()=>{ ref.current?.focus(); },[]);
  useEffect(()=>{
    let t;
    const handler = (e) => {
      // Don't steal focus from other inputs
      const tag = (e.target.tagName||'').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'button') {
        clearTimeout(t);
        t = setTimeout(()=>{ ref.current?.focus(); }, 1500);
      }
    };
    document.addEventListener('click', handler);
    document.addEventListener('focusin', handler);
    return ()=>{ document.removeEventListener('click', handler); document.removeEventListener('focusin', handler); clearTimeout(t); };
  },[]);
  return (
    <div className={`relative rounded-lg border-2 ${error?'border-danger-500 bg-danger-50':'border-brand-500 bg-white'} transition-colors`}>
      <div className="absolute start-4 top-1/2 -translate-y-1/2 text-brand-500 pointer-events-none">
        <Icon name="barcode" size={24}/>
      </div>
      <input
        ref={ref}
        value={value}
        onChange={e=>setValue(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); onSubmit(value); } }}
        placeholder="Scan or type barcode…"
        className="w-full h-14 ps-14 pe-32 text-[20px] font-mono tracking-wider bg-transparent focus:outline-none"
        spellCheck={false} autoComplete="off"
      />
      <span className="absolute end-4 top-1/2 -translate-y-1/2 flex items-center gap-2 text-[12px] text-neutral-500">
        <span className="caret"/>
        <kbd className="px-2 py-0.5 rounded border border-neutral-300 bg-neutral-50 font-mono text-[11px]">Enter</kbd>
      </span>
    </div>
  );
};

const POSPage = ({online, setOnline, pendingSync, setPendingSync, goReceipt}) => {
  const [barcode, setBarcode] = useState('');
  const [cart, setCart] = useState([]);
  const [error, setError] = useState(null);
  const [flashId, setFlashId] = useState(null);
  const [editing, setEditing] = useState(null);
  const [payment, setPayment] = useState(null); // null | 'choose' | 'cash' | 'card'
  const [lineCounter, setLineCounter] = useState(1);

  const playBeep = () => {
    try {
      const a = new (window.AudioContext||window.webkitAudioContext)();
      const o = a.createOscillator(); const g = a.createGain();
      o.frequency.value = 880; o.type='sine';
      g.gain.value = 0.04;
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + 0.08);
    } catch(e){}
  };

  const addProduct = useCallback((p, qty=1) => {
    setCart(prev => {
      const existing = !p.weighted && prev.find(x => x.id===p.id);
      if (existing){
        setFlashId(existing.lineId);
        setTimeout(()=>setFlashId(null), 600);
        return prev.map(x => x.lineId===existing.lineId ? {...x, qty:x.qty+qty} : x);
      }
      const lineId = 'L'+lineCounter;
      setLineCounter(c=>c+1);
      setFlashId(lineId);
      setTimeout(()=>setFlashId(null), 600);
      return [...prev, { ...p, lineId, qty }];
    });
    playBeep();
  }, [lineCounter]);

  const submitBarcode = (raw) => {
    const code = raw.trim();
    if (!code) return;
    setError(null);
    // Scale barcode: starts with 21, total 11 digits
    if (/^21\d{9}$/.test(code)){
      const plu = code.slice(2,7);
      const weightUnits = parseInt(code.slice(7,12),10);
      const weightKg = weightUnits / 1000; // grams to kg approximation
      const prod = PRODUCTS.find(p => p.weighted && p.plu === plu);
      if (prod){
        addProduct(prod, +(weightKg).toFixed(3) || 0.5);
        setBarcode('');
        return;
      }
    }
    const prod = PRODUCTS.find(p => p.barcode === code);
    if (prod){
      addProduct(prod);
      setBarcode('');
    } else {
      setError(`No product found for "${code}"`);
      setTimeout(()=>setError(null), 2500);
    }
  };

  const setQty = (lineId, delta) => setCart(c => c.map(x => x.lineId===lineId ? {...x, qty: Math.max(1, +(x.qty + (x.weighted?delta*0.1:delta)).toFixed(3))} : x));
  const remove = (lineId) => { setCart(c => c.filter(x => x.lineId!==lineId)); setEditing(null); };
  const clear = () => { setCart([]); setEditing(null); setBarcode(''); };

  const subtotal = cart.reduce((s,x)=>s + x.qty*x.price, 0);
  const tax = cart.reduce((s,x)=>s + x.qty*x.price*x.tax, 0);
  const total = subtotal + tax;

  const completeSale = (method, paid, change) => {
    if (!online) setPendingSync(n=>n+1);
    goReceipt({
      id: 'TXN-' + Math.floor(Math.random()*900000+100000),
      items: cart, subtotal, tax, total, method, paid, change,
      ts: new Date(),
      cashier: 'Ahmed H.',
      terminal:'POS-01',
      offline: !online,
    });
    clear();
    setPayment(null);
  };

  return (
    <div className="flex-1 flex flex-col min-h-0">
      <Header title="Point of Sale" subtitle="Branch · Cairo Downtown #03  ·  Shift open 08:12" online={online} pendingSync={pendingSync}
        right={<>
          <Btn variant="ghost" size="sm" onClick={()=>setOnline(o=>!o)}>
            <Icon name={online?'wifi':'wifiOff'} size={14}/> Toggle {online?'offline':'online'}
          </Btn>
        </>} />
      {!online && <OfflineBanner pending={pendingSync}/>}

      <div className="flex-1 grid grid-cols-12 gap-5 p-5 min-h-0 bg-neutral-100">

        {/* LEFT — Scan + grid */}
        <section className="col-span-7 flex flex-col gap-5 min-h-0">
          <div>
            <div className="flex items-center justify-between mb-2">
              <label className="text-[12px] font-semibold uppercase tracking-wider text-neutral-500">Barcode Scanner <span className="text-neutral-400 normal-case font-medium">· always focused</span></label>
              {error ? <span className="text-[12px] font-semibold text-danger-600 fade-in flex items-center gap-1"><Icon name="alert" size={12}/> {error}</span>
                     : <span className="text-[12px] text-neutral-500 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-success-500 animate-pulse"/> Listening</span>}
            </div>
            <BarcodeInput value={barcode} setValue={setBarcode} onSubmit={submitBarcode} error={!!error}/>
            <div className="flex items-center gap-2 mt-2 text-[12px] text-neutral-500">
              <span>Try:</span>
              {['5410188006353','8480000200013','21100401234500','9999999999'].map(b => (
                <button key={b} onClick={()=>{ setBarcode(b); submitBarcode(b); }}
                  className="font-mono text-[11.5px] px-2 py-1 rounded border border-neutral-300 bg-white hover:border-brand-500 hover:text-brand-700">{b}</button>
              ))}
            </div>
          </div>

          <div className="flex-1 flex flex-col min-h-0">
            <div className="flex items-center justify-between mb-2">
              <h3 className="text-[12px] font-semibold uppercase tracking-wider text-neutral-500">Quick select</h3>
              <div className="flex gap-1 text-[12px]">
                {['All','Beverages','Bakery','Dairy','Snacks','Produce'].map((c,i)=>(
                  <button key={c} className={`px-2.5 py-1 rounded-md font-medium ${i===0?'bg-neutral-900 text-white':'text-neutral-600 hover:bg-neutral-200'}`}>{c}</button>
                ))}
              </div>
            </div>
            <div className="grid grid-cols-4 gap-3 overflow-auto pr-1 pb-1">
              {QUICK_GRID.map(p => <QuickProductCard key={p.id} p={p} onAdd={addProduct}/>)}
            </div>
          </div>
        </section>

        {/* RIGHT — Cart */}
        <aside className="col-span-5 flex flex-col min-h-0">
          <Card className="flex-1 flex flex-col min-h-0 overflow-hidden">
            <div className="px-5 h-14 border-b border-neutral-200 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <h2 className="text-[15px] font-semibold">Current Sale</h2>
                <Badge kind="brand">{cart.length} {cart.length===1?'item':'items'}</Badge>
              </div>
              {cart.length>0 && (
                <button onClick={clear} className="text-[12px] font-semibold text-danger-600 hover:underline flex items-center gap-1">
                  <Icon name="trash" size={14}/> Clear cart
                </button>
              )}
            </div>

            <div className="flex-1 overflow-auto min-h-0">
              {cart.length===0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center px-8 py-12">
                  <div className="w-16 h-16 rounded-full bg-neutral-100 grid place-items-center text-neutral-400 mb-3">
                    <Icon name="barcode" size={28}/>
                  </div>
                  <div className="text-[15px] font-semibold text-neutral-700">Cart is empty</div>
                  <div className="text-[13px] text-neutral-500 mt-1 max-w-[260px]">Scan a barcode or tap a product on the left to start a new transaction.</div>
                  <div className="mt-4 flex items-center gap-2 text-[11.5px] text-neutral-500">
                    <kbd className="px-2 py-0.5 rounded border border-neutral-300 bg-neutral-50 font-mono">F2</kbd>
                    <span>discount</span>
                    <kbd className="px-2 py-0.5 rounded border border-neutral-300 bg-neutral-50 font-mono">F8</kbd>
                    <span>payment</span>
                  </div>
                </div>
              ) : (
                cart.map((item, i) => (
                  <CartLine key={item.lineId} item={item} idx={i}
                    onQty={setQty} onRemove={remove}
                    editing={editing} setEditing={setEditing}
                    flash={flashId===item.lineId}/>
                ))
              )}
            </div>

            {/* Totals */}
            <div className="border-t border-neutral-200 bg-neutral-50">
              <div className="px-5 py-3 space-y-1 text-[13.5px]">
                <div className="flex justify-between"><span className="text-neutral-600">Subtotal</span><span className="font-mono tabular-nums">{fmt(subtotal)}</span></div>
                <div className="flex justify-between"><span className="text-neutral-600">VAT</span><span className="font-mono tabular-nums">{fmt(tax)}</span></div>
                <div className="flex justify-between"><span className="text-neutral-600">Discount</span><span className="font-mono tabular-nums text-neutral-400">—</span></div>
              </div>
              <div className="px-5 py-3 border-t border-neutral-200 flex items-center justify-between">
                <span className="text-[13px] font-semibold uppercase tracking-wider text-neutral-500">Total</span>
                <span className="font-mono text-[28px] font-bold tabular-nums">{fmt(total)}</span>
              </div>
              <div className="px-4 pb-4">
                <Btn size="xl" className="w-full text-[15px]" disabled={cart.length===0} onClick={()=>setPayment('choose')}>
                  Proceed to Payment
                  <Icon name="chevR" size={18}/>
                </Btn>
              </div>
            </div>
          </Card>
        </aside>
      </div>

      {payment && (
        <PaymentModal mode={payment} setMode={setPayment} total={total}
          onComplete={completeSale} online={online}/>
      )}
    </div>
  );
};

    <div className="grid grid-cols-3 gap-2">

        <button key={k} onClick={()=>onPress(k)}
          className={`h-[60px] rounded-lg font-semibold text-[20px] focus-ring transition-colors
            ${k==='C' ? 'bg-warn-50 text-warn-700 hover:bg-warn-500/20' :
              k==='⌫' ? 'bg-neutral-100 text-neutral-700 hover:bg-neutral-200' :
              'bg-white border border-neutral-300 hover:border-brand-500 hover:bg-brand-50'}`}>
          {k}
        </button>
      ))}

  const cashNum = parseFloat(cash || '0');

  const press = (k) => {
    if (k==='C') setCash('');
    else if (k==='⌫') setCash(c => c.slice(0,-1));
    else if (k==='.') { if(!cash.includes('.')) setCash(c => (c||'0') + '.'); }
    else setCash(c => (c + k).replace(/^0+(\d)/,'$1'));

  const quickAmts = [total, Math.ceil(total/5)*5, Math.ceil(total/10)*10, Math.ceil(total/20)*20].filter((v,i,a)=>a.indexOf(v)===i);

    if (mode==='card'){
      setCardStage('waiting');

      return ()=>{ clearTimeout(t1); clearTimeout(t2); };

                  <div className="text-[15px] font-semibold">{m.label}</div>

                  {!m.enabled && <div className="mt-2 text-[11px] font-semibold text-warn-700">Requires online</div>}

                <div className="text-[12px] font-semibold uppercase tracking-wider text-neutral-500 mb-2">Cash received</div>
                <div className="h-16 px-4 rounded-lg border-2 border-brand-500 bg-white flex items-center justify-end font-mono text-[32px] font-bold tabular-nums">
                  {cash || '0'}

const Spark = ({pts, color='#3B82F6'}) => {
  const max = Math.max(...pts), min = Math.min(...pts);
  const w = 120, h = 36;
  const d = pts.map((v,i)=>{
    const x = (i/(pts.length-1))*w;
    const y = h - ((v-min)/(max-min||1))*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return (
    <svg width={w} height={h} className="overflow-visible">
      <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      <path d={`${d} L${w},${h} L0,${h} Z`} fill={color} opacity="0.08"/>
    </svg>
  );
};

          <div className="grid grid-cols-3 gap-3">

            <Field label="Currency"><Sel defaultValue="EUR"><option>EGP</option><option>EUR</option><option>USD</option></Sel></Field>
            <Field label="Timezone"><Sel defaultValue="Africa/Cairo"><option>Africa/Cairo</option><option>Europe/Madrid</option><option>UTC</option></Sel></Field>
          </div>
        </Sec>
      </div>
    </div>
  );
};

/* ============================================================
   SCALE / PLU
============================================================ */
const PLU_DATA = [
  {plu:'10040',name:'Beef Steak',price:18.50,updated:'2 days ago',status:'Synced'},
  {plu:'10041',name:'Bananas',price:1.49,updated:'2 days ago',status:'Synced'},
  {plu:'10042',name:'Cheese Cheddar',price:12.99,updated:'5 hours ago',status:'Pending sync'},
  {plu:'10043',name:'Chicken Breast',price:8.99,updated:'2 days ago',status:'Synced'},
  {plu:'10044',name:'Tomatoes',price:2.99,updated:'1 week ago',status:'Synced'},
];

const LabelPreview = ({plu, onClose}) => plu && (
  <div className="fixed inset-0 z-[1100] bg-black/50 backdrop-blur-sm grid place-items-center p-6 fade-in">
    <div className="bg-white rounded-xl shadow-lg w-full max-w-[440px] overflow-hidden">
      <div className="px-6 h-14 border-b border-neutral-200 flex items-center justify-between"><h2 className="text-[16px] font-semibold">Shelf label preview</h2><button onClick={onClose} className="w-9 h-9 grid place-items-center rounded-md hover:bg-neutral-100"><Icon name="x" size={18}/></button></div>
      <div className="p-6">
        <div className="bg-white border-2 border-black p-5 font-mono">
          <div className="text-[18px] font-bold uppercase">{plu.name}</div>
          <div className="text-[10px] mt-0.5">PLU {plu.plu} · per kg</div>
          <div className="text-[44px] font-bold tabular-nums leading-none mt-3">€{plu.price.toFixed(2)}</div>
          <div className="flex items-end gap-2 mt-3 pt-3 border-t border-black">
            <div className="flex gap-px flex-1">{Array.from({length:30}).map((_,i)=><span key={i} className="bg-black" style={{width:i%3?1:2,height:36}}/>)}</div>
          </div>
          <div className="text-[10px] tracking-widest mt-1">21{plu.plu}*****</div>
          <div className="text-[10px] mt-2">Valid from 2026-05-11 · Cairo Downtown #03</div>
        </div>
        <div className="flex gap-2 mt-4"><Btn variant="secondary" className="flex-1" onClick={onClose}>Close</Btn><Btn className="flex-1"><Icon name="printer" size={16}/> Print 1 label</Btn></div>
      </div>
    </div>
  </div>
);

const ScalePage = ({online, pendingSync}) => {
  const [editing,setEditing]=useState(null); const [labelPlu,setLabelPlu]=useState(null);
  return (
    <div className="flex-1 flex flex-col min-h-0 overflow-auto">
      <Header title="Scale / PLU codes" subtitle="Weighted product price catalog · syncs to electronic scales" online={online} pendingSync={pendingSync}
        right={<><Btn variant="secondary" size="sm">Import CSV</Btn><Btn variant="secondary" size="sm">Export CSV</Btn><Btn size="sm"><Icon name="plus" size={14}/> New PLU</Btn></>}/>
      <div className="p-6 flex flex-col gap-4 max-w-[1200px]">
        <Card className="p-5 bg-brand-50/40 border-brand-500/20">
          <div className="flex items-start gap-3">
            <div className="w-10 h-10 rounded-md bg-brand-500 text-white grid place-items-center shrink-0"><Icon name="barcode" size={22}/></div>
            <div>
              <h3 className="text-[14px] font-semibold mb-1">Scale barcode format</h3>
              <p className="text-[13px] text-neutral-600 leading-relaxed">Scale-printed barcodes use the prefix <b className="font-mono">21</b> + a 5-digit PLU code + 5-digit weight in grams.</p>
              <div className="mt-2 flex items-center gap-1 font-mono text-[13px]">
                <span className="px-2 py-1 rounded bg-brand-100 text-brand-700 font-semibold">21</span>
                <span className="px-2 py-1 rounded bg-success-50 text-success-700 font-semibold">10040</span>
                <span className="px-2 py-1 rounded bg-warn-50 text-warn-700 font-semibold">01250</span>
                <span className="text-neutral-500 ms-2">→ PLU 10040 (Beef Steak), weight 1.250kg</span>
              </div>
            </div>
          </div>
        </Card>
        <Card className="overflow-hidden">
          <table className="w-full text-[13.5px]">
            <thead className="bg-neutral-50 text-[11.5px] uppercase tracking-wider text-neutral-500"><tr><th className="px-4 py-3 text-start font-semibold">PLU code</th><th className="text-start font-semibold">Product</th><th className="text-end font-semibold">Price / kg</th><th className="text-start font-semibold ps-6">Last updated</th><th className="text-start font-semibold">Status</th><th className="px-4 text-end font-semibold">Actions</th></tr></thead>
            <tbody>{PLU_DATA.map(p=>(
              <tr key={p.plu} className="border-t border-neutral-100 hover:bg-neutral-50" style={{height:36}}>
                <td className="px-4 font-mono font-semibold text-brand-700">{p.plu}</td>
                <td className="font-medium">{p.name}</td>
                <td className="text-end">{editing===p.plu?(
                  <input defaultValue={p.price.toFixed(2)} autoFocus onBlur={()=>setEditing(null)} onKeyDown={e=>e.key==='Enter'&&setEditing(null)} className="w-24 h-8 px-2 rounded border border-brand-500 text-end font-mono focus-ring"/>
                ):(
                  <button onClick={()=>setEditing(p.plu)} className="font-mono font-semibold tabular-nums hover:bg-brand-50 px-2 py-1 rounded">€{p.price.toFixed(2)}</button>
                )}</td>
                <td className="ps-6 text-neutral-500 text-[12.5px]">{p.updated}</td>
                <td><Badge kind={p.status==='Synced'?'success':'warn'}>{p.status}</Badge></td>
                <td className="px-4 text-end"><div className="inline-flex gap-1"><button onClick={()=>setLabelPlu(p)} className="h-8 px-2.5 rounded text-[12.5px] font-semibold text-brand-600 hover:bg-brand-50">Print label</button><button onClick={()=>setEditing(p.plu)} className="h-8 px-2.5 rounded text-[12.5px] font-semibold text-neutral-600 hover:bg-neutral-100">Edit</button></div></td>
              </tr>))}
            </tbody>
          </table>
        </Card>
      </div>
      <LabelPreview plu={labelPlu} onClose={()=>setLabelPlu(null)}/>
    </div>
  );
};

/* ============================================================
   APP
============================================================ */
function App(){
  const [authed, setAuthed] = useState(false);
  const [route, setRoute] = useState('pos');
  const [online, setOnline] = useState(true);
  const [pendingSync, setPendingSync] = useState(0);
  const [receiptTxn, setReceiptTxn] = useState(null);

  if (!authed) return <LoginScreen onLogin={()=>setAuthed(true)}/>;

  return (
    <div className="h-screen w-screen flex bg-neutral-100 overflow-hidden">
      <Sidebar route={route} setRoute={(r)=>{ setRoute(r); setReceiptTxn(null); }} onLogout={()=>setAuthed(false)}/>
      <main className="flex-1 flex flex-col min-h-0">
        {receiptTxn ? (
          <ReceiptScreen txn={receiptTxn} onDone={()=>setReceiptTxn(null)}/>
        ) : route==='pos' ? (
          <POSPage online={online} setOnline={setOnline}
            pendingSync={pendingSync} setPendingSync={setPendingSync}
            goReceipt={setReceiptTxn}/>
        ) : route==='dashboard' ? (
          <Dashboard online={online} setOnline={setOnline} pendingSync={pendingSync}/>
        ) : route==='products' ? (
          <ProductsPage online={online} setOnline={setOnline} pendingSync={pendingSync}/>
        ) : route==='sales' ? (
          <SalesPage online={online} pendingSync={pendingSync}/>
        ) : route==='users' ? (
          <UsersPage online={online} pendingSync={pendingSync}/>
        ) : route==='settings' ? (
          <SettingsPage online={online} pendingSync={pendingSync}/>
        ) : route==='scale' ? (
          <ScalePage online={online} pendingSync={pendingSync}/>
        ) : null}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
